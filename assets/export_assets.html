  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="190" x2="256" y2="252" />

    <circle cx="256" cy="190" r="7" fill="#FFFFFF" />

  </g>
  <text x="256" y="440" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#FFFFFF"

  <text x="256" y="468"

    // Foreground SVG (transparent background for Android Adaptive Icon foreground)
    const svgForeground = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">

    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />

  <polygon points="256,86 384,160 384,308 256,382 128,308 128,160" 
           fill="#0B3B3F" stroke="url(#tealGrad)" stroke-width="8" stroke-linejoin="round" />

           fill="url(#goldGrad)" opacity="0.85" />
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="190" x2="256" y2="252" />
    <line x1="256" y1="252" x2="202" y2="283" />
    <line x1="256" y1="252" x2="310" y2="283" />
    <circle cx="256" cy="190" r="7" fill="#FFFFFF" />

  <text x="256" y="468"

        text-anchor="middle">
    PROJETO FAPEPI
  </text>
</svg>`;

    async function svgToDataUrl(svgStr, width, height) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    async function generateAll() {
      const appLogoData = await svgToDataUrl(svgContent, 1024, 1024);
      const adaptiveFgData = await svgToDataUrl(svgForeground, 1024, 1024);
      const splashData = await svgToDataUrl(svgContent, 1024, 1024);
      const faviconData = await svgToDataUrl(svgContent, 192, 192);

      const outputs = document.getElementById('outputs');
      outputs.innerHTML = `
        <div id="data-applogo" data-b64="${appLogoData}"></div>
        <div id="data-adaptive" data-b64="${adaptiveFgData}"></div>
        <div id="data-splash" data-b64="${splashData}"></div>
        <div id="data-favicon" data-b64="${faviconData}"></div>
      `;
      document.getElementById('status').innerText = 'Done!';
    }

    generateAll();
  </script>
</body>
</html>
