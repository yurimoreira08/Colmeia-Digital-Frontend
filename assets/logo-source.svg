<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4F55" />
      <stop offset="100%" stop-color="#072B2E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer subtle hexagon grid / digital pattern -->
  <g stroke="#14B8A6" stroke-width="2" opacity="0.18" fill="none">
    <!-- Background Hexagon Array -->
    <polygon points="256,60 330,102 330,188 256,230 182,188 182,102" />
    <polygon points="370,126 444,168 444,254 370,296 296,254 296,168" />
    <polygon points="142,126 216,168 216,254 142,296 68,254 68,168" />
    <polygon points="256,274 330,316 330,402 256,444 182,402 182,316" />
  </g>

  <!-- Central Honeycomb Shield (Emblem) -->
  <polygon points="256,86 384,160 384,308 256,382 128,308 128,160" 
           fill="#0B3B3F" stroke="url(#tealGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Honeycomb Cells -->
  <!-- Top Center Cell -->
  <polygon points="256,128 310,159 310,221 256,252 202,221 202,159" 
           fill="url(#goldGrad)" opacity="0.95" />

  <!-- Bottom Left Cell -->
  <polygon points="202,221 256,252 256,314 202,345 148,314 148,252" 
           fill="url(#tealGrad)" opacity="0.85" />

  <!-- Bottom Right Cell -->
  <polygon points="310,221 364,252 364,314 310,345 256,314 256,252" 
           fill="url(#goldGrad)" opacity="0.85" />

  <!-- Central Digital Node Connector Lines -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="190" x2="256" y2="252" />
    <line x1="256" y1="252" x2="202" y2="283" />
    <line x1="256" y1="252" x2="310" y2="283" />
    
    <!-- Pulse nodes -->
    <circle cx="256" cy="190" r="7" fill="#FFFFFF" />
    <circle cx="202" cy="283" r="7" fill="#FFFFFF" />
    <circle cx="310" cy="283" r="7" fill="#FFFFFF" />
    <circle cx="256" cy="252" r="9" fill="#FCD34D" />
  </g>

  <!-- Typography: COLMEIA DIGITAL -->
  <text x="256" y="440" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#FFFFFF" 
        text-anchor="middle">
    COLMEIA DIGITAL
  </text>
  <text x="256" y="468" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#5EEAD4" 
        text-anchor="middle">
    PROJETO FAPEPI
  </text>
</svg>
